<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算得准 — 在线算命</title>
<style>
  :root {
    --bg: #0f0d12;
    --bg-card: #1a1620;
    --bg-input: #231e2a;
    --gold: #c9a84c;
    --gold-light: #e0c878;
    --gold-dim: #8b7230;
    --text: #d4cfc7;
    --text-dim: #8a8580;
    --border: #2a2435;
    --red: #c0392b;
    --red-light: #e74c3c;
    --green: #2ecc71;
    --blue: #5dade2;
    --purple: #9b59b6;
    --orange: #e67e22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", "STSong", "Songti SC", "SimSun", "KaiTi", serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    overflow-x: hidden;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(123,97,50,0.04) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30Z' fill='none' stroke='rgba(201,168,76,0.015)' stroke-width='0.5'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  .header {
    text-align: center; padding: 70px 0 50px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .header::after {
    content: ""; display: block; width: 80px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 24px auto 0;
  }
  .header h1 {
    font-size: 56px; font-weight: 900; color: var(--gold);
    letter-spacing: 10px; margin-bottom: 10px;
    text-shadow: 0 0 40px rgba(201,168,76,0.25);
    animation: headerGlow 3s ease-in-out infinite alternate;
  }
  @keyframes headerGlow {
    from { text-shadow: 0 0 20px rgba(201,168,76,0.15); }
    to   { text-shadow: 0 0 50px rgba(201,168,76,0.35); }
  }
  .header p { color: var(--text-dim); font-size: 15px; letter-spacing: 6px; }

  /* Category Grid */
  .section-title {
    font-size: 18px; color: var(--gold-light); margin: 44px 0 22px;
    padding-left: 14px; border-left: 3px solid var(--gold);
    letter-spacing: 2px;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .section-title, .card {
    animation: fadeInUp 0.6s ease forwards;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 30px;
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 32px 20px; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: center;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 60%);
    transition: opacity 0.3s;
  }
  .card:hover {
    border-color: var(--gold-dim); transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.15);
  }
  .card:hover::before { opacity: 1; }
  .card .icon { font-size: 38px; margin-bottom: 12px; display: block; }
  .card .name { font-size: 17px; color: var(--gold-light); margin-bottom: 4px; font-weight: 600; }
  .card .desc { font-size: 12px; color: var(--text-dim); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 100; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 44px; max-width: 600px; width: 92%;
    max-height: 85vh; overflow-y: auto; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h2 {
    font-size: 24px; color: var(--gold); margin-bottom: 6px;
    text-align: center; letter-spacing: 4px;
  }
  .modal .subtitle { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 28px; }
  .modal .close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer;
  }
  .modal .close:hover { color: var(--gold); }

  /* Form elements */
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 10px 14px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-size: 14px; font-family: inherit;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold-dim); }
  textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > * { flex: 1; }
  .form-group { margin-bottom: 18px; }
  .btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    border: none; border-radius: 4px; color: #1a1510; font-size: 16px;
    font-weight: 700; cursor: pointer; letter-spacing: 2px;
    font-family: inherit; transition: all 0.25s;
    box-shadow: 0 2px 10px rgba(201,168,76,0.15);
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,0.25); }

  /* Result area */
  .result {
    margin-top: 28px; padding: 24px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 6px; display: none;
  }
  .result.active { display: block; }
  .result h3 { color: var(--gold-light); font-size: 16px; margin-bottom: 12px; }
  .result .score {
    font-size: 48px; color: var(--gold); font-weight: 700;
    text-align: center; padding: 16px 0;
    text-shadow: 0 0 20px rgba(201,168,76,0.2);
  }
  .result .detail { color: var(--text); font-size: 14px; line-height: 2; }
  .result .tag {
    display: inline-block; padding: 2px 10px; border-radius: 3px;
    font-size: 12px; margin: 2px;
  }
  .tag.gold { background: rgba(201,168,76,0.15); color: var(--gold-light); }
  .tag.red { background: rgba(231,76,60,0.15); color: var(--red-light); }
  .tag.green { background: rgba(46,204,113,0.15); color: var(--green); }
  .tag.blue { background: rgba(93,173,226,0.15); color: var(--blue); }
  .tag.purple { background: rgba(155,89,182,0.15); color: var(--purple); }
  .tag.orange { background: rgba(230,126,34,0.15); color: var(--orange); }

  /* Tarot cards */
  .tarot-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .tarot-card {
    width: 90px; height: 140px; background: linear-gradient(135deg, #2c1f3d, #1a1030);
    border: 1px solid var(--border); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-dim); cursor: pointer;
    transition: all 0.3s; text-align: center; padding: 8px;
  }
  .tarot-card:hover { border-color: var(--gold-dim); transform: translateY(-4px); }
  .tarot-card.revealed { border-color: var(--gold); color: var(--gold-light); }

  /* Fortune sticks */
  .stick-area { text-align: center; padding: 30px 0; }
  .stick-tube {
    width: 60px; height: 200px; background: linear-gradient(180deg, #8B4513, #6B3410);
    margin: 0 auto 20px; border-radius: 10px; cursor: pointer;
    position: relative; transition: transform 0.1s;
  }
  .stick-tube.shaking { animation: shake 0.5s ease-in-out infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  .stick {
    width: 6px; height: 120px; background: #d4a76a;
    position: absolute; bottom: -80px; left: 50%;
    transform: translateX(-50%) rotate(var(--angle, 0deg));
    transition: all 0.6s ease-out; border-radius: 3px;
    pointer-events: none;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .header { padding: 50px 0 36px; }
    .header h1 { font-size: 36px; letter-spacing: 6px; }
    .header p { font-size: 13px; letter-spacing: 4px; }
    .header::after { width: 50px; margin-top: 18px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card { padding: 24px 14px; }
    .card .icon { font-size: 28px; }
    .card .name { font-size: 15px; }
    .modal { padding: 24px 16px; }
    .modal h2 { font-size: 20px; }
    .section-title { font-size: 16px; margin: 32px 0 16px; }
    .form-row { flex-direction: column; }
  }



  .location-selects { display: flex; gap: 6px; flex-wrap: wrap; }
  .location-selects select { min-width: 90px !important; }
  .location-info { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Profile Bar */
  .profile-bar {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 20px; margin: 20px 0 10px;
  }
  .profile-bar.saved { border-color: var(--gold-dim); }
  .profile-row {
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
  }
  .profile-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .profile-item label {
    font-size: 11px; color: var(--text-dim); margin: 0; white-space: nowrap;
  }
  .profile-item input, .profile-item select {
    width: auto; min-width: 100px; padding: 8px 10px; font-size: 13px;
  }
  .profile-item input[type="date"] { min-width: 140px; }
  .profile-save {
    width: auto !important; padding: 8px 20px !important; font-size: 13px !important;
    white-space: nowrap;
  }
  .profile-saved-msg {
    color: var(--green); font-size: 12px; margin-left: 8px; display: none;
  }
  .profile-saved-msg.show { display: inline; }
  #lunar-picker select { min-width: 70px !important; }
  @media (max-width: 600px) {
    .profile-row { flex-direction: column; gap: 10px; }
    .profile-item { width: 100%; }
    .profile-item input, .profile-item select { width: 100%; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }
</style>
</head>
<body>

<div id="js-error" style="display:none;background:#c0392b;color:#fff;padding:12px;margin:10px 0;border-radius:4px;font-family:monospace;font-size:12px;white-space:pre-wrap"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('js-error');
  if (el) {
    el.style.display = 'block';
    el.innerHTML = 'JS ERROR at line ' + line + ': ' + msg + (err && err.stack ? '\n' + err.stack.split('\n').slice(0,3).join('\n') : '');
  }
  return false;
};
</script>

<div class="app">
  <div class="header">
    <h1>算 得 准</h1>
    <p>心 诚 则 灵 · 算 不 虚 发</p>
  </div>

  <div class="profile-bar" id="profile-bar">
    <div class="profile-row">
      <div class="profile-item"><label>姓名</label><input type="text" id="profile-name" placeholder="输入姓名" onchange="autoSaveProfile()"></div>
      <div class="profile-item"><label>出生日期</label>
        <select id="profile-cal-type" onchange="switchCalType()" style="min-width:70px">
          <option value="solar">公历</option>
          <option value="lunar">农历</option>
        </select>
        <span id="solar-picker"><input type="date" id="profile-solar-date" value="2000-01-01" onchange="autoSaveProfile()" style="min-width:140px"></span>
        <div id="lunar-picker" style="display:none;display:flex;gap:6px;align-items:center">
          <select id="profile-lunar-year" onchange="updateLunarMonths();autoSaveProfile()"></select><span style="font-size:12px;color:var(--text-dim)">年</span>
          <select id="profile-lunar-month" onchange="updateLunarDays();autoSaveProfile()"></select><span style="font-size:12px;color:var(--text-dim)">月</span>
          <select id="profile-lunar-day" onchange="autoSaveProfile()"></select><span style="font-size:12px;color:var(--text-dim)">日</span>
        </div>
      </div>
      <div class="profile-item"><label>性别</label><select id="profile-gender" onchange="autoSaveProfile()"><option value="male">男</option><option value="female">女</option></select></div>
      <div class="profile-item"><label>时辰</label><select id="profile-hour" onchange="autoSaveProfile()"><option value="0">子时 23-01</option><option value="1">丑时 01-03</option><option value="2">寅时 03-05</option><option value="3">卯时 05-07</option><option value="4">辰时 07-09</option><option value="5">巳时 09-11</option><option value="6">午时 11-13</option><option value="7">未时 13-15</option><option value="8">申时 15-17</option><option value="9">酉时 17-19</option><option value="10">戌时 19-21</option><option value="11">亥时 21-23</option></select></div>
      <div class="profile-item"><label>出生地点</label>
        <div class="location-selects">
          <select id="profile-province" onchange="updateCities()"><option value="">选择省份</option></select>
          <select id="profile-city" onchange="updateDistricts();autoSaveProfile()"><option value="">选择城市</option></select>
        </div>
        <div class="location-info" id="location-info"></div>
      </div>
      <button class="btn profile-save" onclick="saveProfile()">保存</button>
      <span class="profile-saved-msg" id="profile-saved-msg">&#10003; 已保存</span>
    </div>
  </div>

  <div class="section-title">命理推算</div>
  <div class="grid" id="grid-destiny"></div>

  <div class="section-title">占卜预测</div>
  <div class="grid" id="grid-divination"></div>

  <div class="section-title">相术解析</div>
  <div class="grid" id="grid-physiognomy"></div>

  <div class="section-title">运程综合</div>
  <div class="grid" id="grid-fortune"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
// ===== Data =====
const categories = {
  destiny: [
    { id:'bazi', name:'八字命理', desc:'四柱八字·五行生克', icon:'☯' },
    { id:'ziwei', name:'紫微斗数', desc:'命盘十二宫·星曜', icon:'⭐' },
    { id:'guzhong', name:'称骨算命', desc:'袁天罡称骨·骨重批命', icon:'⚖' },
    { id:'wuxing', name:'五行测算', desc:'金木水火土·旺衰', icon:'🪐' },
    { id:'name', name:'姓名解析', desc:'三才五格·数理', icon:'📛' },
  ],
  divination: [
    { id:'tarot', name:'塔罗牌', desc:'大阿卡那·三牌阵', icon:'🃏' },
    { id:'lots', name:'求签占卜', desc:'观音灵签·六爻', icon:'🏮' },
    { id:'dream', name:'周公解梦', desc:'梦境释义·吉凶', icon:'🌙' },
    { id:'liuyao', name:'六爻占卜', desc:'铜钱起卦·爻辞', icon:'🪙' },
  ],
  physiognomy: [
    { id:'face', name:'面相分析', desc:'五官十二宫·气色', icon:'👤' },
    { id:'palm', name:'手相解读', desc:'三大纹路·丘位', icon:'✋' },
  ],
  fortune: [
    { id:'daily', name:'每日运势', desc:'今日宜忌·吉时', icon:'📅' },
    { id:'zodiac', name:'星座运势', desc:'十二星座·星盘', icon:'♈' },
    { id:'shengxiao', name:'生肖运势', desc:'十二生肖·流年', icon:'🐉' },
    { id:'love', name:'姻缘配对', desc:'八字合婚·匹配度', icon:'💕' },
    { id:'wealth', name:'财运预测', desc:'正财偏财·财库', icon:'💰' },
    { id:'fengshui', name:'风水运势', desc:'方位吉凶·布局', icon:'🏠' },
  ],
};

// ===== Render Category Cards =====
function renderCards() {
  for (const [group, items] of Object.entries(categories)) {
    const grid = document.getElementById('grid-' + group);
    items.forEach(cat => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<span class="icon">${cat.icon}</span><div class="name">${cat.name}</div><div class="desc">${cat.desc}</div>`;
      card.onclick = () => openModal(cat);
      grid.appendChild(card);
    });
  }
}

// ===== Modal =====
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');


// ===== Auto-calc with profile =====
const autoCalcMap = {
  bazi: calcBazi, ziwei: calcZiwei, guzhong: calcGuzhong, name: calcName,
  wuxing: calcWuxing, love: calcLove, wealth: calcWealth,
  daily: calcDaily,
};

function autoCalcIfProfileSaved() {
  if (!userProfile || !userProfile.saved) return;
  const modal = document.getElementById('modal');
  if (!modal) return;
  const h2 = modal.querySelector('h2');
  if (!h2) return;
  for (const [id, fn] of Object.entries(autoCalcMap)) {
    const allCats = [...categories.destiny, ...categories.divination, ...categories.physiognomy, ...categories.fortune];
    const cat = allCats.find(c => c.id === id);
    if (!cat) continue;
    if (!h2.textContent.includes(cat.name)) continue;
    
    setTimeout(() => {
      const date = getProfileSolarDate();
      const dateEl = document.getElementById(id+'-date') || document.getElementById('bazi-date') || document.getElementById('zw-date') || document.getElementById('wealth-date') || document.getElementById('daily-date');
      if (dateEl) dateEl.value = date;
      const genderEl = document.getElementById(id+'-gender') || document.getElementById('bazi-gender') || document.getElementById('zw-gender');
      if (genderEl) genderEl.value = userProfile.gender;
      const hourEl = document.getElementById(id+'-hour') || document.getElementById('bazi-hour') || document.getElementById('zw-hour') || document.getElementById('gz-hour');
      if (hourEl) {
        const trueSolarH = getTrueSolarHour(userProfile.hour * 2); // Convert hour index (0-11) to approximate clock hour
        hourEl.value = userProfile.hour;
      }
      // guzhong specific
      if (id === 'guzhong') {
        const gzYear = document.getElementById('gz-year');
        if (gzYear) gzYear.value = userProfile.lunarYear;
        const gzMonth = document.getElementById('gz-month');
        if (gzMonth) gzMonth.value = userProfile.lunarMonth > 12 ? userProfile.lunarMonth - 12 : userProfile.lunarMonth;
        const gzDay = document.getElementById('gz-day');
        if (gzDay && userProfile.lunarDay) gzDay.value = userProfile.lunarDay;
      }
      const nameEl = document.getElementById(id+'-name') || document.getElementById('nm-input') || document.getElementById('wx-name') || document.getElementById('love-name1');
      if (nameEl && userProfile.name) nameEl.value = userProfile.name;
      
      // Auto-calculate
      fn();
      
      // Add indicator but DON'T hide form
      const existing = modal.querySelector('.profile-indicator');
      if (!existing) {
        const indicator = document.createElement('div');
        indicator.className = 'profile-indicator';
        indicator.style.cssText = 'text-align:center;color:var(--gold-light);font-size:12px;margin:8px 0;padding:6px;background:rgba(201,168,76,0.06);border-radius:4px';
        indicator.textContent = '已自动使用个人资料测算';
        const subtitle = modal.querySelector('.subtitle');
        if (subtitle) subtitle.after(indicator);
      }
    }, 250);
    break;
  }
}

function openModal(cat) {
  const forms = {
    bazi: formBazi,
    guzhong: formGuzhong,
    ziwei: formZiwei,
    wuxing: formWuxing,
    name: formName,
    guzhong: formGuzhong,
    tarot: formTarot,
    lots: formLots,
    dream: formDream,
    liuyao: formLiuyao,
    face: formFace,
    palm: formPalm,
    daily: formDaily,
    zodiac: formZodiac,
    shengxiao: formShengxiao,
    love: formLove,
    wealth: formWealth,
    fengshui: formFengshui,
  };
  const handler = forms[cat.id];
  modal.innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <h2>${cat.icon} ${cat.name}</h2>
    <div class="subtitle">${cat.desc}</div>
    ${handler ? handler(cat) : '<p style="text-align:center;color:var(--text-dim);">即将上线…</p>'}
  `;
  overlay.classList.add('active');
  // Re-bind events after DOM update
  setTimeout(() => bindEvents(cat.id), 100);
}

function closeModal() {
  overlay.classList.remove('active');
}
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ===== Form Templates =====
function formBazi() {
  setTimeout(() => fillFromProfile('bazi'), 150);
  const now = new Date();
  return `
    <div class="form-group"><label>出生日期（公历）</label><input type="date" id="bazi-date" value="${now.getFullYear()-25}-01-01"></div>

// Days from 1900-01-31 (lunar 1900-01-01) to a date
function daysFromBase(year, month, day) {
  let total = 0;
  for (let y = 1900; y < year; y++) {
    total += 365;
    if ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) total++;
  }
  const monDays = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  if ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) monDays[2] = 29;
  for (let m = 1; m < month; m++) total += monDays[m];
  total += day;
  return total;
}

function leapMonth(year) { return lunarInfo[year - 1900] & 0xf; }
function leapDays(year) { return leapMonth(year) ? ((lunarInfo[year - 1900] & 0x10000) ? 30 : 29) : 0; }
function monthDays(year, month) {
  return (lunarInfo[year - 1900] & (0x10000 >> month)) ? 30 : 29;
}
function yearDays(year) {
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[year - 1900] & i) ? 1 : 0;
  return sum + leapDays(year);
}

function solarToLunar(date) {
  const baseYear = 1900, baseMonth = 1, baseDay = 31;
  let offset = daysFromBase(date.getFullYear(), date.getMonth() + 1, date.getDate()) - daysFromBase(baseYear, baseMonth, baseDay) + 1;
  let year, month, day;
  for (year = baseYear; year < 2101 && offset > 0; year++) offset -= yearDays(year);
  if (offset < 0) { offset += yearDays(--year); }
  const leap = leapMonth(year);
  let isLeap = false;
  for (month = 1; month < 13 && offset > 0; month++) {
    if (leap > 0 && month === leap + 1 && !isLeap) { month--; isLeap = true; offset -= leapDays(year); }
    else offset -= monthDays(year, month);
    if (isLeap && month === leap + 0) isLeap = false;
  }
  if (offset === 0 && leap === month && !isLeap) { isLeap = true; month--; }
  if (offset < 0) offset += (isLeap ? leapDays(year) : monthDays(year, --month));
  day = offset;
  return { year, month, day, isLeap, leap: leapMonth(year) };
}

function lunarDateStr(lunar) {
  let m = (lunar.isLeap ? '闰' : '') + lunarMonths[lunar.month - 1] + '月';
  let d = lunarDays[lunar.day - 1];
  return m + d;
}

function lunarYearName(year) {
  return tianGan[(year - 4) % 10] + diZhi[(year - 4) % 12] + '年';
}

// ===== 神煞计算 =====
function calcShenSha(dayGan, dayZhiIndex, yearZhiIndex) {
  const result = [];
  // 天乙贵人
  const tianYiMap = { '甲':'丑未','乙':'子申','丙':'亥酉','丁':'亥酉','戊':'丑未','己':'子申','庚':'丑未','辛':'寅午','壬':'巳卯','癸':'巳卯' };
  const tianYi = tianYiMap[dayGan] || '';
  if (tianYi.includes(dizhi[dayZhiIndex])) result.push({name:'天乙贵人', desc:'逢凶化吉，贵人相助', tag:'gold'});
  // 文昌
  const wenChangMap = { '甲':'巳','乙':'午','丙':'申','丁':'酉','戊':'申','己':'酉','庚':'亥','辛':'子','壬':'寅','癸':'卯' };
  if (wenChangMap[dayGan] === dizhi[dayZhiIndex]) result.push({name:'文昌星', desc:'聪明好学，文采出众', tag:'green'});
  // 桃花
  const taoHuaMap = { '寅午戌':'卯','申子辰':'酉','亥卯未':'子','巳酉丑':'午' };
  for (const [key, val] of Object.entries(taoHuaMap)) {
    if (key.includes(dizhi[yearZhiIndex]) && dizhi[dayZhiIndex] === val) {
      result.push({name:'桃花', desc:'人缘佳，异性缘旺', tag:'purple'});
    }
  }
  // 驿马
  const yiMaMap = { '寅午戌':'申','申子辰':'寅','亥卯未':'巳','巳酉丑':'亥' };
  for (const [key, val] of Object.entries(yiMaMap)) {
    if (key.includes(dizhi[yearZhiIndex]) && dizhi[dayZhiIndex] === val) {
      result.push({name:'驿马', desc:'奔波劳碌，动中求财', tag:'blue'});
    }
  }
  // 华盖
  const huaGaiMap = { '寅午戌':'戌','申子辰':'辰','亥卯未':'未','巳酉丑':'丑' };
  for (const [key, val] of Object.entries(huaGaiMap)) {
    if (key.includes(dizhi[yearZhiIndex]) && dizhi[dayZhiIndex] === val) {
      result.push({name:'华盖', desc:'才华横溢，宜艺术创作', tag:'blue'});
    }
  }
  return result;
}

function seedFromDate(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h) + str.charCodeAt(i);
  return Math.abs(h);
}

// ===== 节气定月（干支月）=====
function getJieQiMonth(gDate) {
  const m = gDate.getMonth() + 1;
  const d = gDate.getDate();
  const doy = m * 100 + d;
  // Before 立春 (Feb 6) = 丑月 (12)
  if (doy < 206) return 12;
  // After 立春, match the correct solar term
  const jieQiDOY = [206,306,405,506,606,707,808,908,1008,1108,1207];
  for (let i = jieQiDOY.length - 1; i >= 0; i--) {
    if (doy >= jieQiDOY[i]) {
      return i + 1; // month 1-11
    }
  }
  return 12;
}

function calcGuzhong() {
  const year = parseInt(document.getElementById('gz-year')?.value || new Date().getFullYear());
  const month = parseInt(document.getElementById('gz-month')?.value || 1);
  // Convert lunar date to Gregorian, then get solar term month
  let solarMonth = month;
  // Build a lunar date from form inputs and convert to Gregorian
  try {
    const baseDate = new Date(1900, 0, 31);
    let offset = 0;
    for (let y = 1900; y < year; y++) offset += yearDays(y);
    const leapM = leapMonth(year);
    for (let m = 1; m < month; m++) {
      offset += monthDays(year, m);
      if (leapM > 0 && m === leapM) offset += leapDays(year);
    }
    offset += (day || 1) - 1;
    const gDate = new Date(baseDate.getTime() + offset * 86400000);
    solarMonth = getJieQiMonth(gDate);
  } catch(e) {
    solarMonth = month;
  }
  const day = parseInt(document.getElementById('gz-day')?.value || 1);
  let hour = parseInt(document.getElementById('gz-hour')?.value || 0);
  hour = getTrueSolarHour(hour * 2);
  if (!year) return;
  
  const gzIndex = (year - 4) % 60;
  const yw = guzhongYearWeights[gzIndex] || 0;
  const boneMonth = (day > 15 && month < 12) ? month + 1 : month;
  const mw = guzhongMonthWeights[boneMonth] || 0;
  const dw = guzhongDayWeights[day] || 0;
  const hw = guzhongHourWeights[hour] || 0;
  const total = yw + mw + dw + hw;
  
  const gan = tiangan[(year - 4) % 10], zhi = dizhi[(year - 4) % 12];
  const totalLiang = Math.floor(total / 10);

function calcName() {
  const name = document.getElementById('nm-input')?.value.trim();
  if (!name || name.length < 2) { showResult('name-result', '<p style="color:var(--red-light)">请输入有效的中文姓名</p>'); return; }

  const strokes = name.split('').map(c => seedFromDate(c) % 20 + 1);
  const total = strokes.reduce((a,b) => a+b, 0);
  const tiange = strokes[0] + 1;
  const renge = strokes[0] + (strokes[1] || 0);
  const dige = (strokes[1] || 0) + (strokes[2] || 1);
  const waige = total - strokes[0] + 1;
  const zongge = total;

  const judge = (n) => {
    const lucky = [1,3,5,6,7,8,11,13,15,16,17,18,21,23,24,25,29,31,32,33,35,37,39,41,45,47,48,52,63,65,67,68,81];
    return lucky.includes(n) ? '<span class="tag green">吉</span>' : (n > 40 ? '<span class="tag orange">平</span>' : '<span class="tag red">凶</span>');
  };

  const parts = [`<h3>📛 姓名五格分析</h3>`];
  parts.push(`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0;font-size:11px;text-align:center">`);
  parts.push(`<div style="color:var(--gold-light)">天格<br>${tiange}<br>${judge(tiange)}</div>`);
  parts.push(`<div style="color:var(--gold-light)">人格<br>${renge}<br>${judge(renge)}</div>`);
  parts.push(`<div style="color:var(--gold-light)">地格<br>${dige}<br>${judge(dige)}</div>`);
  parts.push(`<div style="color:var(--gold-light)">外格<br>${waige}<br>${judge(waige)}</div>`);
  parts.push(`<div style="color:var(--gold-light)">总格<br>${zongge}<br>${judge(zongge)}</div>`);
  parts.push(`</div>`);

  const score = Math.min(95, Math.max(30, 50 + seedFromDate(name) % 45));
  parts.push(`<div class="score">${score}<span style="font-size:16px;color:var(--text-dim)"> / 100分</span></div>`);
  parts.push(`<div class="detail"><strong>三才配置：</strong>${pick(['金金土','木火土','水土金','火土金','金土木'], seedFromDate(name+'sc'))} ${pick(['大吉','吉','中吉'], seedFromDate(name+'sj'))}</div>`);
  parts.push(`<div class="detail"><strong>姓名寓意：</strong>${pick(['才艺出众，一生顺遂','根基稳固，晚景荣昌','聪明睿智，中年有成','性格刚毅，白手起家','温厚平和，人缘极佳'], seedFromDate(name+'ym'))}</div>`);
  parts.push(`<div class="detail"><strong>事业运：</strong>${pick(['适合管理岗位','适合技术研发','适合自主创业','适合文化艺术'], seedFromDate(name+'sy'))}</div>`);

  showResult('name-result', parts.join(''));
}

function renderTarot() {
  const grid = document.getElementById('tarot-grid');
  if (!grid) return;
  const majorArcana = [
    '愚者','魔术师','女祭司','女皇','皇帝','教皇','恋人','战车','力量','隐士',
    '命运之轮','正义','倒吊人','死神','节制','恶魔','高塔','星星','月亮','太阳','审判','世界'
  ];
  const keys = ['past','present','future'];
  const selected = [];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(seedFromDate(Math.random().toString() + i) * majorArcana.length) % majorArcana.length;
    selected.push(majorArcana[idx]);
  }
  grid.innerHTML = keys.map((k,i) => `
    <div class="tarot-card" data-idx="${i}" data-card="${selected[i]}">
      <div class="pos">${k === 'past' ? '过去' : k === 'present' ? '现在' : '未来'}</div>
      <div class="card-name" style="display:none">${selected[i]}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.tarot-card').forEach(card => {
    card.onclick = function() {
      if (this.classList.contains('revealed')) return;
      this.classList.add('revealed');
      this.querySelector('.pos').style.display = 'none';
      this.querySelector('.card-name').style.display = 'block';
      const allCards = grid.querySelectorAll('.tarot-card.revealed');
      if (allCards.length === 3) showTarotResult(selected);
    };
  });
}

// ===== Helpers =====
function elementOfGan(gan) {
  const map = { '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水' };
  return map[gan] || '土';
}

function pick(arr, seed) {
  if (typeof seed === 'number') return arr[seed % arr.length];
  if (typeof seed === 'string') {
    let h = 0; for (let i = 0; i < seed.length; i++) h = ((h << 5) - h) + seed.charCodeAt(i);
    return arr[Math.abs(h) % arr.length];
  }
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr, seed) {
  let h = 0; if (typeof seed === 'string') { for (let i = 0; i < seed.length; i++) h = ((h << 5) - h) + seed.charCodeAt(i); h = Math.abs(h); }
  else h = seed || 0;
  const result = [...arr];
  for (let i = result.length - 1; i > 0; i--) {
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    const j = h % (i + 1);
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function getTrueSolarHour(stdHour) {
  // stdHour: 0-23 (the clock hour of birth)
  // Returns adjusted hour index 0-11 for 时辰
  const offsetMinutes = (userLocation.longitude - 120) * 4;
  const totalMinutes = stdHour * 60 + offsetMinutes;
  let adjustedMinutes = totalMinutes;
  if (adjustedMinutes < 0) adjustedMinutes += 24 * 60;
  if (adjustedMinutes >= 24 * 60) adjustedMinutes -= 24 * 60;
  // 时辰: 子时 starts at 23:00 previous day through 01:00
  // Map adjusted hour to 时辰 index (0=子, 1=丑, ... 11=亥)
  const adjHour = adjustedMinutes / 60;
  let shichen;
  if (adjHour >= 23 || adjHour < 1) shichen = 0;
  else if (adjHour < 3) shichen = 1;
  else if (adjHour < 5) shichen = 2;
  else if (adjHour < 7) shichen = 3;
  else if (adjHour < 9) shichen = 4;
  else if (adjHour < 11) shichen = 5;
  else if (adjHour < 13) shichen = 6;
  else if (adjHour < 15) shichen = 7;
  else if (adjHour < 17) shichen = 8;
  else if (adjHour < 19) shichen = 9;
  else if (adjHour < 21) shichen = 10;
  else shichen = 11;
  return shichen;
}

function switchCalType() {
  const type = document.getElementById('profile-cal-type').value;
  document.getElementById('solar-picker').style.display = type === 'solar' ? '' : 'none';
  document.getElementById('lunar-picker').style.display = type === 'lunar' ? 'flex' : 'none';
  if (type === 'lunar') updateLunarMonths();
}

function updateLunarMonths() {
  const year = parseInt(document.getElementById('profile-lunar-year').value);
  const mSel = document.getElementById('profile-lunar-month');
  const leap = leapMonth(year);
  const prevVal = mSel.value;
  mSel.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    mSel.appendChild(new Option(lunarMonths[m-1] + '月', m));
    // Insert leap month right after its corresponding regular month
    if (leap > 0 && m === leap) {
      const leapOpt = new Option('闰' + lunarMonths[leap-1] + '月', leap + 12);
      leapOpt.style.color = '#e0c878';
      leapOpt.style.fontWeight = 'bold';
      mSel.appendChild(leapOpt);
    }
    // Show leap info at the top section
    if (m === 1 && leap > 0) {
      const infoOpt = new Option('闰' + lunarMonths[leap-1] + '月 (闰月)', leap + 12);
      infoOpt.style.color = '#e0c878';
      infoOpt.style.fontWeight = 'bold';
      infoOpt.disabled = false;
      // Don't add here - the leap month is inserted at the right position above
    }
  }
  // Restore previous selection if valid, otherwise default to 1
  const exists = Array.from(mSel.options).some(o => o.value == prevVal);
  mSel.value = exists ? prevVal : 1;
  updateLunarDays();
}

function updateLunarDays() {
  const year = parseInt(document.getElementById('profile-lunar-year').value);
  const month = parseInt(document.getElementById('profile-lunar-month').value);
  const dSel = document.getElementById('profile-lunar-day');
  dSel.innerHTML = '';
  let days;
  if (month > 12) {
    days = leapDays(year);
  } else {
    days = monthDays(year, month);
  }
  for (let d = 1; d <= days; d++) {
    dSel.appendChild(new Option(lunarDays[d-1], d));
  }
  dSel.value = 1;
}

function collectProfile() {
  userProfile.name = document.getElementById('profile-name').value.trim();
  userProfile.calType = document.getElementById('profile-cal-type').value;
  userProfile.solarDate = document.getElementById('profile-solar-date').value;
  userProfile.lunarYear = parseInt(document.getElementById('profile-lunar-year').value);
  userProfile.lunarMonth = parseInt(document.getElementById('profile-lunar-month').value);
  userProfile.lunarDay = parseInt(document.getElementById('profile-lunar-day').value);
  userProfile.gender = document.getElementById('profile-gender').value;
  userProfile.hour = parseInt(document.getElementById('profile-hour').value);
  userProfile.location = JSON.stringify(userLocation);
  userProfile.saved = true;
}

function saveProfile() {
  collectProfile();
  localStorage.setItem('suanProfile', JSON.stringify(userProfile));
  document.getElementById('profile-bar').classList.add('saved');
  const msg = document.getElementById('profile-saved-msg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function autoSaveProfile() {
  collectProfile();
  localStorage.setItem('suanProfile', JSON.stringify(userProfile));
  document.getElementById('profile-bar').classList.add('saved');
}

function getProfileSolarDate() {
  if (userProfile.calType === 'solar') {
    return userProfile.solarDate;
  } else {
    const baseDate = new Date(1900, 0, 31);
    let offset = 0;
    for (let y = 1900; y < userProfile.lunarYear; y++) offset += yearDays(y);
    const leap = leapMonth(userProfile.lunarYear);
    const target = userProfile.lunarMonth; // 1-12 normal, >12 = leap month
    const effectiveMonth = target > 12 ? target - 12 : target;
    // Add days for all regular months before the effective month number
    for (let m = 1; m < effectiveMonth; m++) {
      offset += monthDays(userProfile.lunarYear, m);
    }
    // If target is a leap month: we've counted up to (leap-1), now add the regular month at leap position
    if (target > 12) {
      offset += monthDays(userProfile.lunarYear, effectiveMonth);
    }
    // If target is a regular month AFTER the leap month position, add leap month days
    else if (leap > 0 && effectiveMonth > leap) {
      offset += leapDays(userProfile.lunarYear);
    }
    offset += userProfile.lunarDay - 1;
    const result = new Date(baseDate.getTime() + offset * 86400000);
    return result.toISOString().split('T')[0];
  }
}

function fillFromProfile(prefix) {
  if (!userProfile.saved) return;
  const date = getProfileSolarDate();
  const dateEl = document.getElementById(prefix + '-date') || document.getElementById('bazi-date') || document.getElementById('zw-date') || document.getElementById('wealth-date');
  if (dateEl) dateEl.value = date;
  const genderEl = document.getElementById(prefix + '-gender') || document.getElementById('bazi-gender') || document.getElementById('zw-gender');
  if (genderEl) genderEl.value = userProfile.gender;
  const hourEl = document.getElementById(prefix + '-hour') || document.getElementById('bazi-hour') || document.getElementById('zw-hour');
  if (hourEl) hourEl.value = userProfile.hour;
  const nameEl = document.getElementById(prefix + '-name') || document.getElementById('nm-input') || document.getElementById('wx-name') || document.getElementById('love-name1');
  if (nameEl && userProfile.name) nameEl.value = userProfile.name;
}
